# Portfolio Beach CI (docs/12 section 5, docs/16 section 2).
# Actions are referenced by tag here; run `bash scripts/pin-actions.sh` on a signed-in machine to
# rewrite every `uses:` to a full commit SHA before enabling branch protection (P0-3, SEC-17.5).
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  PNPM_VERSION: 10.28.0
jobs:
  guard:
    name: employer-data and style guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4 # pin to SHA
      - run: bash scripts/check-employer-data.sh
      - run: bash scripts/check-style.sh
  ci:
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4 # pin to SHA
      - uses: pnpm/action-setup@v4 # pin to SHA
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v4 # pin to SHA
        with: { node-version-file: .nvmrc, cache: pnpm }
      - uses: astral-sh/setup-uv@v5 # pin to SHA
        with: { enable-cache: true }
      - run: pnpm install --frozen-lockfile
      - run: uv sync --project apps/worker-py --frozen
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm --filter @pb/worker-py lint
      - run: pnpm test # unit + db (in-process Postgres, no Docker)
      - run: pnpm test:rls && pnpm test:workflows
      - run: pnpm test:calc # golden + property + Python cross-check
      - run: pnpm test:evals # the gold-set eval with the fixture-backed models (vitest takes no --mock flag)
      - run: pnpm check:classification
  e2e:
    needs: ci
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # The whole suite took 38 minutes on its first run here (a private repository's runner has two
    # cores); the limit leaves room for a slow day without letting a hung run burn the hour.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4 # pin to SHA
      - uses: pnpm/action-setup@v4 # pin to SHA
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v4 # pin to SHA
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --filter @pb/web exec playwright install --with-deps chromium
      # One run: it includes the tests tagged @a11y. `pnpm test:a11y` runs those alone, for a
      # laptop; running it here as well repeated 29 of the 64 tests and overran the limit.
      - run: pnpm test:e2e
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # actions: read is what the CodeQL action needs on a private repository (it reads its own
    # workflow run); without it the analysis ends in "Resource not accessible by integration".
    permissions: { contents: read, security-events: write, actions: read }
    env:
      # GitHub's code scanning and dependency review are offered to a public repository, and to a
      # private one only with GitHub's paid code security. Where they are not offered the upload
      # is refused ("Code scanning is not enabled for this repository"), so those three steps run
      # when the repository is public or the repository variable CODE_SCANNING is "on". The free
      # checks after them run always; the static analysis runs in the ci job's lint (decision 0016).
      HOSTED_SCANNING: ${{ github.event.repository.private == false || vars.CODE_SCANNING == 'on' }}
    steps:
      - uses: actions/checkout@v4 # pin to SHA
      - uses: github/codeql-action/init@v3 # pin to SHA
        if: env.HOSTED_SCANNING == 'true'
        with: { languages: 'javascript-typescript,python' }
      - uses: github/codeql-action/analyze@v3 # pin to SHA
        if: env.HOSTED_SCANNING == 'true'
      - uses: actions/dependency-review-action@v4 # pin to SHA
        if: env.HOSTED_SCANNING == 'true' && github.event_name == 'pull_request'
        with: { fail-on-severity: moderate, deny-licenses: 'GPL-2.0, GPL-3.0, AGPL-3.0' }
      - uses: pnpm/action-setup@v4 # pin to SHA
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v4 # pin to SHA
        with: { node-version-file: .nvmrc, cache: pnpm }
      - uses: astral-sh/setup-uv@v5 # pin to SHA
        with: { enable-cache: true }
      - run: pnpm install --frozen-lockfile
      # The same deny list as the dependency review above (package.json, check:licenses).
      - run: pnpm check:licenses
      # Known vulnerabilities at moderate and above, in the pnpm lockfile and in uv.lock. They ask
      # the advisory databases, so they run on pull requests, as the dependency review does.
      - run: pnpm check:audit
        if: github.event_name == 'pull_request'
      - run: pnpm check:audit:py
        if: github.event_name == 'pull_request'
