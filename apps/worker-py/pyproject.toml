[project]
name = "pb-worker-py"
version = "0.1.0"
description = "Portfolio Beach Python worker: calculation cross-check (docs/08); document and Office workers arrive in later phases"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=9.1",
  "hypothesis>=6.168",
  "ruff>=0.16",
  "mypy>=2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/calc_check"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
packages = ["calc_check"]
files = ["src", "tests"]
